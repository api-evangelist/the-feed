aid: the-feed
name: The Feed
description: 'The Feed is an online sports nutrition store for endurance athletes, stocking products
  from more than 300 brands across fuel, hydration, supplements, and recovery. Founded by Matt Johnson
  while managing a Tour de France cycling team, it sells gels, chews, and drink mixes as single servings
  so athletes can test products without committing to full boxes, offers AutoShip subscriptions and a
  Feed First membership, and is the official nutrition partner of USA Triathlon. The company builds
  personalized fueling plans around before/during/after-workout nutrition, tested with input from over
  200,000 athletes. It is a consumer e-commerce brand (Shopify storefront) with no public developer API;
  its machine-readable surfaces are a published llms.txt and a Google Merchant product feed.'
